                            const parts = accumulatedText.split('[METADATA_SEPARATOR]');
                            const streamingText = parts[0];
                            const jsonText = parts[1];
                            let finalFeedback = parsePartialJSON(streamingText);

                            if (jsonText.trim()) {
                                try {
                                    const parsed = JSON.parse(jsonText.trim());
                                    const ensureArray = (val) => Array.isArray(val) ? val : (val ? [val] : []);
                                    const codeActs = ensureArray(parsed.code_actions);
                                    const action = codeActs.find(item => item && item.after) || codeActs[0] || null;
                                    const codeSuggestion = action
                                        ? [
                                            action.before ? `Current:\n${action.before}` : '',
                                            action.after ? `\nLearned repair pattern:\n${action.after}` : ''
                                          ].filter(Boolean).join('\n')
                                        : '';

                                    finalFeedback = {
                                        headline: finalFeedback.headline || parsed.headline || '',
                                        root_cause: finalFeedback.root_cause || parsed.root_cause || '',
                                        primary_fix: finalFeedback.primary_fix || parsed.primary_fix || '',
                                        confidence: parsed.confidence || 0,
                                        evidence: ensureArray(finalFeedback.evidence?.length ? finalFeedback.evidence : parsed.evidence),
                                        fix_steps: ensureArray(finalFeedback.fix_steps?.length ? finalFeedback.fix_steps : parsed.fix_steps),
                                        prevention: ensureArray(finalFeedback.prevention?.length ? finalFeedback.prevention : parsed.prevention),
                                        debug_questions: ensureArray(finalFeedback.debug_questions?.length ? finalFeedback.debug_questions : parsed.debug_questions),
                                        code_actions: codeActs,
                                        codeSuggestion
                                    };
                                } catch (e) {}
                            }

                            setRca(p => p ? {
                                ...p,
                                streamText: streamingText,
                                feedback: finalFeedback
                            } : p);
                        } else {
                            setRca(p => p ? { ...p, streamText: accumulatedText } : p);
                        }
                    }
                } catch (err) {
                    if (err.name === 'AbortError' || controller.signal.aborted) return;
                    setRca(p => p ? {
                        ...p,
                        llmLoading: false,
                        mlError: `Log debugger unavailable: ${err.message || String(err)}`
                    } : p);
                } finally {
                    if (controller.signal.aborted) return;
                    setRca(p => {
                        if (!p) return p;
                        const finalFb = p.feedback || parsePartialJSON(p.streamText);
                        return { ...p, feedback: finalFb, llmLoading: false };
                    });
                }
            };

            // Initialize Xterm.js
            useEffect(() => {
                console.log("XTERM SETUP TRIGGERED");
                console.log("window.Terminal:", !!window.Terminal, "termRef.current:", !!termRef.current);
                try {
                    if (!termInstance.current && termRef.current && window.Terminal) {
                        console.log("INITIALIZING XTERM INSTANCE...");
                        const term = new window.Terminal({
                            theme: { background: '#070708', foreground: '#e2e8f0', cursor: '#3b82f6' },
                            fontFamily: "'JetBrains Mono', monospace",
                            fontSize: 13,
                            cursorBlink: true
                        });
                        let fitAddon = null;
                        if (window.FitAddon) {
                            if (typeof window.FitAddon.FitAddon === 'function') {
                                fitAddon = new window.FitAddon.FitAddon();
                            } else if (typeof window.FitAddon === 'function') {
                                fitAddon = new window.FitAddon();
                            }
                        }
                        if (fitAddon) {
                            fitAddonRef.current = fitAddon;
                            term.loadAddon(fitAddon);
                        }
                        term.open(termRef.current);
                        
                        // Delay fit slightly to ensure container is sized
                        if (fitAddon) {
                            setTimeout(() => {
                                if (termRef.current?.clientWidth && termRef.current.clientHeight) fitAddon.fit();
                            }, 100);
                        }
                        
                        termInstance.current = term;

                        term.write('PYGLIDE SYSTEM CONSOLE\r\n');
                        term.write('>>> ');

                        term.onData(e => {
                            if (!runtimeStateRef.current.ready && !isWaitingForInputRef.current) return;
                            if (!isWaitingForInputRef.current && !isReplRef.current) return;

                            switch (e) {
                                case '\r': // Enter
                                    term.write('\r\n');
                                    const code = currentLineRef.current;
                                    currentLineRef.current = '';
                                    if (isWaitingForInputRef.current) {
                                        isWaitingForInputRef.current = false;
                                        provideInput(code);
                                    } else if (isReplRef.current) {
                                        handleReplEnter(code);
                                    }
                                    break;
                                case '\u007F': // Backspace
                                    if (currentLineRef.current.length > 0) {
                                        currentLineRef.current = currentLineRef.current.slice(0, -1);
                                        term.write('\b \b');
                                    }
                                    break;
                                default:
                                    if ((e >= String.fromCharCode(0x20) && e <= String.fromCharCode(0x7E)) || e.length >= 2) {
                                        currentLineRef.current += e;
                                        term.write(e);
                                    }
                            }
                        });
                        
                    }
                } catch (e) {
                    console.error("XTERM INIT ERROR:", e);
                }
            }, []);

            const rebootWorker = (fromRun = false, preserveConsole = false) => {
                if (workerRef.current) {
                    workerRef.current.terminate();
                }
                isWaitingForInputRef.current = false;
                pendingInputUidRef.current = null;
                isReplRef.current = !fromRun;
                currentLineRef.current = '';
                
                if (termInstance.current && !preserveConsole) {
                    termInstance.current.clear();
                    termInstance.current.write('\x1bcPYGLIDE SYSTEM CONSOLE\r\n');
                    termInstance.current.write('Loading Python runtime...\r\n');
                }
                
                setEngineReady(false);
                setEngineError('');
                runtimeStateRef.current.ready = false;
                const w = new Worker('/pyworker.js?t=' + Date.now());
                w.onmessage = (e) => {
                    if (workerRef.current !== w) return;
                    const { type, msg, uid, id, error, result } = e.data;
                    if (type === 'ready') {
                        runtimeStateRef.current.ready = true;
                        setEngineReady(true);
                        setEngineError('');
                        if (isReplRef.current) termInstance.current?.write('>>> ');
                        return;
                    }
                    if (type === 'init_error') {
                        runtimeStateRef.current.ready = false;
                        runtimeStateRef.current.running = false;
                        setEngineReady(false);
                        setIsRunning(false);
                        setEngineError(error || 'Python runtime could not be loaded.');
                        termInstance.current?.write(`\r\nPython runtime unavailable: ${error}\r\n`);
                        return;
                    }
                    if (type === 'stdout' || type === 'stderr') {
                        if (termInstance.current) {
                            const colorPrefix = type === 'stderr' ? '\x1b[31m' : '';
                            const colorSuffix = type === 'stderr' ? '\x1b[0m' : '';
                            termInstance.current.write(colorPrefix + msg.replace(/\n/g, '\r\n') + colorSuffix);
                        }
                    } else if (type === 'done' || type === 'error') {
                        runtimeStateRef.current.running = false;
                        setIsRunning(false);
                        if (type === 'error' && termInstance.current) {
                            termInstance.current.write('\x1b[31m' + error.replace(/\n/g, '\r\n') + '\x1b[0m\r\n');
                        }
                        if (type === 'done' && result !== undefined && termInstance.current) {
                            termInstance.current.write(String(result).replace(/\n/g, '\r\n') + '\r\n');
                        }
                        
                        if (id === 'run_main' || id?.startsWith('repl_')) {
                            if (termInstance.current) termInstance.current.write('>>> ');
                            isReplRef.current = true;
                            if (type === 'done' && id === 'run_main' && activeOperationRef.current?.epoch === analysisEpochRef.current) {
                                setRca(null);
                            }
                        }

                        if (type === 'error') {
                            const operation = activeOperationRef.current;
                            if (!operation || operation.epoch !== analysisEpochRef.current) return;
                            showAnalysis();
                            const currentCode = operation.code;
                            const base = analyze(error, currentCode);

                            if (streamAbortControllerRef.current) {
                                try {
                                    streamAbortControllerRef.current.abort();
                                } catch (e) {}
                            }
                            const controller = new AbortController();
                            streamAbortControllerRef.current = controller;

                            setRca({
                                ...base,
                                sourceFilename: operation.filename,
                                sourceModel: operation.model,
                                feedback: null,
                                llmLoading: true,
                                mlError: null,
                                streamText: ''
                            });

                            const excType = extractExceptionType(error);
                            const excMsg = extractExceptionMessage(error);

                            fetch('http://localhost:8000/stream-feedback', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                signal: controller.signal,
                                body: JSON.stringify({
                                    error: {
                                        type: excType,
                                        message: excMsg,
                                        traceback: error,
                                        line_number: base.frames.length > 0 ? base.frames[base.rc].line : -1,
                                        failing_function: base.frames.length > 0 ? base.frames[base.rc].func : ""
                                    },
                                    rca: null,
                                    similar_bugs: null,
                                    source_code: currentCode,
                                    model: operation.model
                                })
                            }).then(async (streamResponse) => {
                                if (controller.signal.aborted) return;
                                if (!streamResponse.ok) throw new Error(`Stream connection failed: ${streamResponse.status}`);
                                if (!streamResponse.body) throw new Error('ReadableStream not supported');

                                const reader = streamResponse.body.getReader();
                                const decoder = new TextDecoder();
                                let accumulatedText = '';

                                while (true) {
                                    const { done, value } = await reader.read();
                                    if (done || controller.signal.aborted) break;

                                    const chunk = decoder.decode(value, { stream: true });
                                    accumulatedText += chunk;

                                    if (accumulatedText.includes('[METADATA_SEPARATOR]')) {
                                        const parts = accumulatedText.split('[METADATA_SEPARATOR]');
                                        const streamingText = parts[0];
                                        const jsonText = parts[1];

                                        let finalFeedback = parsePartialJSON(streamingText);
                                        
                                        if (jsonText.trim()) {
                                            try {
                                                const parsed = JSON.parse(jsonText.trim());
                                                const ensureArray = (val) => Array.isArray(val) ? val : (val ? [val] : []);
                                                const codeActs = ensureArray(parsed.code_actions);
                                                const action = codeActs.find(item => item && item.after) || codeActs[0] || null;
                                                const codeSuggestion = action
                                                    ? [
                                                        action.before ? `Current:\n${action.before}` : '',
                                                        action.after ? `\nLearned repair pattern:\n${action.after}` : ''
                                                      ].filter(Boolean).join('\n')
                                                    : '';
                                                
                                                finalFeedback = {
                                                     headline: finalFeedback.headline || parsed.headline || '',
                                                     root_cause: finalFeedback.root_cause || parsed.root_cause || '',
                                                     primary_fix: finalFeedback.primary_fix || parsed.primary_fix || '',
                                                     confidence: parsed.confidence || 0,
                                                     evidence: ensureArray(finalFeedback.evidence?.length ? finalFeedback.evidence : parsed.evidence),
                                                     fix_steps: ensureArray(finalFeedback.fix_steps?.length ? finalFeedback.fix_steps : parsed.fix_steps),
                                                     prevention: ensureArray(finalFeedback.prevention?.length ? finalFeedback.prevention : parsed.prevention),
                                                     debug_questions: ensureArray(finalFeedback.debug_questions?.length ? finalFeedback.debug_questions : parsed.debug_questions),
                                                     code_actions: codeActs,
                                                     codeSuggestion
                                                 };
                                            } catch (e) {
                                                // Silent catch: waiting for full JSON chunk
                                            }
                                        }
                                        
                                        setRca(p => p ? {
                                            ...p,
                                            streamText: streamingText,
                                            feedback: finalFeedback,
                                            ins: p.ins
                                        } : p);
                                    } else {
                                        setRca(p => p ? { ...p, streamText: accumulatedText } : p);
                                    }
                                }
                            }).catch((err) => {
                                if (err.name === 'AbortError' || controller.signal.aborted) return;
                                setRca(p => p ? {
                                    ...p,
                                    llmLoading: false,
                                    mlError: `Local ML backend unavailable: ${err.message}`
                                } : p);
                            }).finally(() => {
                                if (controller.signal.aborted) return;
                                setRca(p => {
                                    if (!p) return p;
                                    const finalFb = p.feedback || parsePartialJSON(p.streamText);
                                    return { ...p, feedback: finalFb, llmLoading: false };
                                });
                            });
                        }
                    }
                };
                
                setWorker(w);
                workerRef.current = w;
                w.onerror = event => {
                    if (workerRef.current !== w) return;
                    runtimeStateRef.current = { ready: false, running: false };
                    setEngineReady(false);
                    setIsRunning(false);
                    setEngineError(event.message || 'Python worker failed.');
                    event.preventDefault();
                };
            };

            // Initialize Service Worker and Web Worker
            useEffect(() => {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/sw.js').then(() => {
                        if (!workerRef.current) {
                            rebootWorker();
                        }
                        if (!navigator.serviceWorker.controller) {
                            navigator.serviceWorker.addEventListener('controllerchange', () => {
                                if (!workerRef.current) rebootWorker();
                            });
                        }
                    }).catch(err => {
                        console.error("SW Registration failed:", err);
                        rebootWorker(); // Fallback
                    });
                    
                    navigator.serviceWorker.addEventListener('message', (event) => {
                        if (event.data && event.data.type === 'input_requested') {
                            if (!runtimeStateRef.current.running) return;
                            showConsole();
                            pendingInputUidRef.current = event.data.uid;
                            isWaitingForInputRef.current = true;
                            isReplRef.current = false;
                        }
                    });
                } else {
                    rebootWorker();
                }

                return () => { if (workerRef.current) workerRef.current.terminate(); };
            }, []);

            const provideInput = async (value) => {
                if (!pendingInputUidRef.current) return;
                
                const formData = new FormData();
                formData.append('uid', pendingInputUidRef.current);
                formData.append('value', value);
                
                pendingInputUidRef.current = null;
                
                await fetch('/__pyglide_provide_input__', {
                    method: 'POST',
                    body: formData
                });
            };

            const run = async () => {
                if (!editorInstance.current || !runtimeStateRef.current.ready || runtimeStateRef.current.running) return;
                clearAnalysis();
                showConsole();
                setConsoleMaximized(false);
                const currentCode = editorInstance.current.getValue() || '';
                activeOperationRef.current = { code: currentCode, filename: filesRef.current.find(file => file.id === activeIdRef.current)?.name || 'Untitled.py', model: selectedModelRef.current, epoch: analysisEpochRef.current };
                runtimeStateRef.current.running = true;
                setIsRunning(true);
                
                
                rebootWorker(true);
                
                isReplRef.current = false;
                isWaitingForInputRef.current = false;
                currentLineRef.current = '';
                
                workerRef.current.postMessage({ type: 'run', id: 'run_main', code: currentCode });
            };
            
            const handleReplEnter = async (code) => {
                if (!workerRef.current) return;
                const trimmed = code.trim();
                if (!trimmed) {
                    if (termInstance.current) termInstance.current.write('>>> ');
                    return;
                }
                
                isReplRef.current = false;
                activeOperationRef.current = { code: trimmed, filename: 'Console', model: selectedModelRef.current, epoch: analysisEpochRef.current };
                runtimeStateRef.current.running = true;
                setIsRunning(true);
                workerRef.current.postMessage({ type: 'repl', id: 'repl_' + Date.now(), code: trimmed });
            };

            const stopRuntime = () => {
                if (pendingInputUidRef.current) provideInput('').catch(() => {});
                activeOperationRef.current = null;
                runtimeStateRef.current.running = false;
                setIsRunning(false);
                termInstance.current?.write('\r\nExecution stopped.\r\n');
                rebootWorker(false, true);
            };



            const toggleFolder = (id) => {
                setFiles(prev => prev.map(f => f.id === id ? { ...f, isOpen: !f.isOpen } : f));
            };

            const confirmCreateItem = () => {
                if (!newItemName.trim() || !creatingItem) {
                    setCreatingItem(null);
                    return;
                }
                let finalName = newItemName.trim();
                if (creatingItem.type === 'file' && !finalName.toLowerCase().endsWith('.py')) finalName += '.py';
                if (!validWorkspaceName(finalName)) { alert('Use a valid file or folder name.'); return; }
                
                const parentId = creatingItem.parentId ?? (creatingItem.type === 'file' ? WORKSPACE_FOLDER_ID : null);
                const isDuplicate = files.some(f => f.parentId === parentId && f.name.toLowerCase() === finalName.toLowerCase());
                if (isDuplicate) {
                    alert(`An item named "${finalName}" already exists in this folder.`);
                    return;
                }

                const newId = `user-${crypto.randomUUID()}`;
                const newItem = { 
                    id: newId, 
                    name: finalName, 
                    type: creatingItem.type,
                    parentId,
                    ...(creatingItem.type === 'file' ? { content: '' } : { isOpen: true })
                };
                
                const base = parentId === WORKSPACE_FOLDER_ID && !files.some(file => file.id === WORKSPACE_FOLDER_ID)
                    ? [...files, { id: WORKSPACE_FOLDER_ID, name: 'workspace', type: 'folder', parentId: null, isOpen: true }] : files;
                setFiles([...base.map(file => file.id === parentId ? { ...file, isOpen: true } : file), newItem]);
                if (creatingItem.type === 'file') openFile(newId);
                setCreatingItem(null);
                setNewItemName('');
            };

            const handleNewItemKeyDown = (e) => {
                if (e.key === 'Enter') confirmCreateItem();
                else if (e.key === 'Escape') setCreatingItem(null);
            };

            const handleDragStart = (e, id) => {
                e.dataTransfer.setData('text/plain', id);
                setDraggedNodeId(id);
                e.stopPropagation();
            };

            const handleDrop = (e, dropId) => {
                e.preventDefault();
                e.stopPropagation();
                setDragOverNodeId(null);
                setDraggedNodeId(null);
                
                const dragId = e.dataTransfer.getData('text/plain');
                if (!dragId || dragId === dropId) return;

                const isDescendant = (childId, parentId) => {
                    let current = files.find(f => f.id === childId);
                    while (current && current.parentId) {
                        if (current.parentId === parentId) return true;
                        current = files.find(f => f.id === current.parentId);
                    }
                    return false;
                };

                if (dropId !== null && isDescendant(dropId, dragId)) {
                    alert("Cannot move a folder into its own subfolder.");
                    return;
                }

                setFiles(prev => {
                    const newFiles = prev.map(file => ({ ...file }));
                    const dragIndex = newFiles.findIndex(f => f.id === dragId);
                    if (dragIndex === -1) return prev;
                    
                    const dragNode = newFiles[dragIndex];
                    let targetParentId = null;
                    let dropIndex = -1;

                    if (dropId !== null) {
                        const dropNode = newFiles.find(f => f.id === dropId);
                        if (!dropNode) return prev;
                        if (dropNode.type === 'folder') {
                            targetParentId = dropId;
                        } else {
                            targetParentId = dropNode.parentId;
                            dropIndex = newFiles.findIndex(f => f.id === dropId);
                        }
                    }

                    const duplicate = newFiles.some(f => f.id !== dragId && f.parentId === targetParentId && f.name === dragNode.name);
                    if (duplicate) {
                        alert(`An item named "${dragNode.name}" already exists in the destination.`);
                        return prev;
                    }

                    dragNode.parentId = targetParentId;
                    newFiles.splice(dragIndex, 1);

                    if (dropIndex !== -1) {
                        // Adjust index if we removed an item before it
                        if (dragIndex < dropIndex) dropIndex--;
                        newFiles.splice(dropIndex, 0, dragNode);
                    } else {
                        newFiles.push(dragNode);
                        if (dropId !== null) {
                            const dropNode = newFiles.find(f => f.id === dropId);
                            if (dropNode) dropNode.isOpen = true;
                        }
                    }
                    return newFiles;
                });
            };

            const handleDeleteFile = (e, id) => {
                e.stopPropagation();
                const target = files.find(file => file.id === id);
                if (!target) return;
                const ids = subtreeIds(id, files);
                if (target.isExamplesFolder) files.forEach(file => { if (file.examplePath) ids.add(file.id); });
                const selected = files.filter(file => ids.has(file.id));
                setDeleteTarget({ id, name: target.name, ids: [...ids],
                    filenames: selected.filter(file => file.examplePath).map(file => file.examplePath),
                    deleteFolder: Boolean(target.isExamplesFolder),
                    requiresPassword: selected.some(file => file.isPredefined),
                    fileCount: selected.filter(file => file.type === 'file').length });
                setDeletePassword('');
                setDeleteError('');
                setContextMenu(null);
            };

            const cancelDeletion = () => {
                if (isDeleting) return;
                setDeleteTarget(null);
                setDeletePassword('');
                setDeleteError('');
            };

            const confirmDeletion = async (event) => {
                event.preventDefault();
                if (!deleteTarget || isDeleting) return;
                deletingRef.current = true;
                setIsDeleting(true);
                setDeleteError('');
                examplesRequestRef.current?.abort();
                try {
                    let deletedNames = [];
                    if (deleteTarget.filenames.length || deleteTarget.deleteFolder) {
                        const response = await fetch(`${EXAMPLES_API}/delete`, {
                            method: 'POST', headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ filenames: deleteTarget.filenames,
                                password: deleteTarget.requiresPassword ? deletePassword : undefined,
                                delete_folder: deleteTarget.deleteFolder })
                        });
                        const data = await response.json();
                        if (!response.ok) {
                            if (response.status === 403) setDeleteTarget(previous => previous ? { ...previous, requiresPassword: true } : previous);
                            throw new Error(data.detail || 'The files could not be deleted.');
                        }
                        deletedNames = data.deleted || [];
                    }
                    const ids = new Set(deleteTarget.ids);
                    filesRef.current.forEach(file => { if (deletedNames.includes(file.examplePath)) ids.add(file.id); });
                    const next = filesRef.current.filter(file => !ids.has(file.id));
                    filesRef.current = next;
                    // Persist immediately so deleted entries cannot return on reload.
                    localStorage.setItem('pyglide_workspace', JSON.stringify(next));
                    setFiles(next);
                    const tabs = openTabsRef.current.filter(id => !ids.has(id));
                    setOpenTabs(tabs);
                    localStorage.setItem('pyglide_tabs', JSON.stringify(tabs));
                    if (ids.has(activeIdRef.current)) setActiveId(tabs[0] || null);
                    setDeleteTarget(null);
                    setDeletePassword('');
                } catch (error) {
                    setDeleteError(error.message || 'Deletion failed. Start the backend and try again.');
                } finally {
                    deletingRef.current = false;
                    setIsDeleting(false);
                    setExamplesLoading(false);
                }
            };

            const handleContextMenu = (e, file) => {
                e.preventDefault();
                e.stopPropagation();
                setContextMenu({ x: e.clientX, y: e.clientY, file });
            };

            const closeContextMenu = () => {
                if (contextMenu) setContextMenu(null);
            };

            useEffect(() => {
                document.addEventListener('click', closeContextMenu);
                return () => document.removeEventListener('click', closeContextMenu);
            }, [contextMenu]);

            const handleDuplicate = (id) => {
                const target = files.find(file => file.id === id);
                if (!target) return;
                const ids = subtreeIds(id, files);
                const mapping = new Map([...ids].map(key => [key, `user-${crypto.randomUUID()}`]));
                const copyName = uniqueCopyName(target.name, files.filter(file => file.parentId === target.parentId).map(file => file.name));
                const copies = files.filter(file => ids.has(file.id)).map(file => {
                    const { examplePath, isPredefined, isExamplesFolder, sourceContent, ...ordinaryFile } = file;
                    return { ...ordinaryFile, id: mapping.get(file.id), name: file.id === id ? copyName : file.name,
                        parentId: file.id === id ? target.parentId : mapping.get(file.parentId),
                        ...(file.type === 'folder' ? { isOpen: true } : {}) };
                });
                setFiles(previous => [...previous, ...copies]);
                setContextMenu(null);
            };

            const handleRenameStart = (id) => {
                const target = files.find(f => f.id === id);
                if (target) {
                    renameCommittedRef.current = false;
                    setRenamingId(id);
                    setRenamingName(target.name);
                }
                setContextMenu(null);
            };

            const handleRenameSubmit = (id) => {
                if (renameCommittedRef.current) return;
                renameCommittedRef.current = true;
                const target = files.find(file => file.id === id);
                const name = renamingName.trim();
                if (target && name !== target.name) {
                    if (!validWorkspaceName(name) || files.some(file => file.id !== id && file.parentId === target.parentId && file.name.toLowerCase() === name.toLowerCase())) {
                        setRenamingId(null);
                        alert('Use a valid, unique name within this folder.');
                        return;
                    }
                    setFiles(previous => previous.map(file => file.id === id ? { ...file, name } : file));
                }
                setRenamingId(null);
            };

            const renderTree = (parentId, level = 0) => {
                const nodes = files.filter(f => f.parentId === parentId);
                const children = nodes.map(f => {
                    const isDragOver = dragOverNodeId === f.id;
                    const styleBase = { 
                        paddingLeft: `${10 + level * 15}px`, 
                        border: isDragOver ? '1px dashed var(--accent)' : '1px solid transparent',
                        background: isDragOver ? 'var(--accent-dim)' : ''
                    };
                    
                    if (f.type === 'folder') {
                        return (
                            <div key={f.id}>
                                <div className="file-item" 
                                    style={{ ...styleBase, display: 'flex', justifyContent: 'space-between', fontWeight: 600 }} 
                                    onClick={() => toggleFolder(f.id)}
                                    onContextMenu={(e) => handleContextMenu(e, f)}
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, f.id)}
                                    onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOverNodeId(f.id); }}
                                    onDragLeave={() => setDragOverNodeId(null)}
                                    onDrop={(e) => handleDrop(e, f.id)}
                                >
                                    <span style={{ display: 'flex', alignItems: 'center', gap: '6px', flex: 1, overflow: 'hidden' }}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{minWidth: '14px'}}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                        {renamingId === f.id ? (
                                            <input 
                                                autoFocus 
                                                value={renamingName} 
                                                onChange={e => setRenamingName(e.target.value)} 
                                                onKeyDown={e => { if (e.key === 'Enter') handleRenameSubmit(f.id); if (e.key === 'Escape') { renameCommittedRef.current = true; setRenamingId(null); } }}
                                                onBlur={() => handleRenameSubmit(f.id)} 
                                                style={{background:'transparent', border:'none', outline:'none', color:'var(--text)', width:'100%', fontFamily:'inherit', fontSize:'inherit'}}
                                            />
                                        ) : (
                                            <span className="file-name-text" onContextMenu={(e) => handleContextMenu(e, f)}>{f.name}</span>
                                        )}
                                    </span>
                                </div>
                                {f.isOpen && renderTree(f.id, level + 1)}
                            </div>
                        );
                    } else {
                        return (
                            <div key={f.id} 
                                className={`file-item ${activeId === f.id ? 'active' : ''}`} 
                                style={styleBase} 
                                onClick={() => openFile(f.id)}
                                draggable
                                onDragStart={(e) => handleDragStart(e, f.id)}
                                onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOverNodeId(f.id); }}
                                onDragLeave={() => setDragOverNodeId(null)}
                                onDrop={(e) => handleDrop(e, f.id)}
                                onContextMenu={(e) => handleContextMenu(e, f)}
                            >
                                <span style={{ display: 'flex', alignItems: 'center', gap: '6px', flex: 1, overflow: 'hidden' }}>
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{minWidth: '14px'}}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                                    {renamingId === f.id ? (
                                        <input 
                                            autoFocus 
                                            value={renamingName} 
                                            onChange={e => setRenamingName(e.target.value)} 
                                            onKeyDown={e => { if (e.key === 'Enter') handleRenameSubmit(f.id); if (e.key === 'Escape') { renameCommittedRef.current = true; setRenamingId(null); } }}
                                            onBlur={() => handleRenameSubmit(f.id)} 
                                            style={{background:'transparent', border:'none', outline:'none', color:'var(--text)', width:'100%', fontFamily:'inherit', fontSize:'inherit'}}
                                        />
                                    ) : (
                                        <span className="file-name-text">{f.name}</span>
                                    )}
                                </span>
                            </div>
                        );
                    }
                });

                if (creatingItem && creatingItem.parentId === parentId) {
                    children.push(
                        <div key="new-item" className="file-item" style={{ paddingLeft: `${10 + level * 15}px`, display: 'flex', alignItems: 'center', gap: '6px' }}>
                            {creatingItem.type === 'folder' 
                                ? <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                                : <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                            }
                            <input 
                                autoFocus 
                                value={newItemName} 
                                onChange={e => setNewItemName(e.target.value)} 
                                onKeyDown={handleNewItemKeyDown} 
                                onBlur={() => setCreatingItem(null)} 
                                placeholder={creatingItem.type === 'folder' ? "folder_name" : "file_name.py"} 
                                style={{background:'transparent', border:'none', outline:'none', color:'var(--text)', width:'100%', fontFamily:'inherit', fontSize:'inherit'}}
                            />
                        </div>
                    );
                }
                return children;
            };

            return (
                <div className="layout" style={{ '--explorer-width': `${layout.explorerWidth}px`, '--analysis-width': `${layout.analysisWidth}px`, '--console-height': `${layout.consoleHeight}px` }}>
                    <input
                        ref={logFileInputRef}
                        className="log-upload-input"
                        type="file"
                        accept=".log,.txt,.out,.err,.trace,.csv,.xlsx,.xls"
                        onChange={handleLogFileUpload}
                    />
                    {view === 'stats' && <AnalyticsPanel onBack={()=>setView('editor')} />}
                    {view === 'benchmarks' && <BenchmarksPanel onBack={()=>setView('editor')} selectedModel={selectedModel} onSelect={setSelectedModel} />}
                    <div className="explorer-shell" id="explorer-shell" hidden={!layout.explorerVisible}>
                    <aside className="sidebar" id="explorer-panel" aria-label="Explorer">
                        <div className="explorer-heading"><div className="logo" style={{marginBottom: 0}}>PYGLIDE</div><button className="panel-action" aria-label="Hide explorer" title="Hide Explorer (Ctrl+B)" onClick={() => togglePane('explorer')}><PaneIcon name="close"/></button></div>
                        
                        <div style={{display:'flex', flexDirection:'column', gap:'10px', padding:'0 10px', marginBottom:'2rem'}}>
                            <button className="btn btn-secondary" style={{width:'100%', display:'flex', alignItems:'center', gap:'10px', padding:'10px 12px', borderRadius:'6px', justifyContent:'flex-start', cursor:'pointer'}} onClick={()=>setView('stats')} title="View Programmer Focus Analytics">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>
                                PROGRAMMER FOCUS
                            </button>
                            <button className="btn btn-secondary" style={{width:'100%', display:'flex', alignItems:'center', gap:'10px', padding:'10px 12px', borderRadius:'6px', justifyContent:'flex-start', cursor:'pointer'}} onClick={()=>setView('benchmarks')} title="View Local Model Guide">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--success)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                                MODEL GUIDE
                            </button>
                            <div style={{display:'flex', flexDirection:'column', gap:'4px', width:'100%'}}>
                                <button className="btn btn-secondary" style={{width:'100%', display:'flex', alignItems:'center', gap:'10px', padding:'10px 12px', borderRadius:'6px', justifyContent:'flex-start', cursor:'pointer'}} onClick={()=>logFileInputRef.current?.click()} title="Upload a log file for root cause analysis (accepts .log, .txt, .out, .err, .trace, .csv, .xlsx)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#facc15" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>
                                    LOG DEBUGGER
                                </button>
                                <span style={{fontSize:'0.6rem', color:'var(--text-dim)', paddingLeft:'28px', opacity:0.75, fontStyle:'italic'}}>
                                    Accepts: .log, .txt, .out, .err, .trace, .csv, .xlsx
                                </span>
                            </div>
                        </div>

                        <div
                            className="explorer-tools"
                            style={{
                                display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'15px', paddingLeft:'10px', paddingRight:'10px',
                                border: dragOverNodeId === 'root' ? '1px dashed var(--accent)' : '1px solid transparent',
                                background: dragOverNodeId === 'root' ? 'var(--accent-dim)' : ''
                            }}
                            onDragOver={(e) => { e.preventDefault(); e.stopPropagation(); setDragOverNodeId('root'); }}
                            onDragLeave={() => setDragOverNodeId(null)}
                            onDrop={(e) => handleDrop(e, null)}
                        >
                            <div style={{fontSize:'0.7rem', color:'var(--text-dim)', fontWeight:800, letterSpacing:'1px'}}>EXPLORER</div>
                            <div style={{display:'flex', gap:'10px'}}>
                                <button onClick={() => { setCreatingItem({ type: 'file', parentId: null }); setNewItemName(''); }} style={{background:'none', border:'none', color:'var(--text-dim)', cursor:'pointer', fontSize:'1rem', lineHeight:1}} title="New File">+</button>
                                <button onClick={() => { setCreatingItem({ type: 'folder', parentId: null }); setNewItemName(''); }} style={{background:'none', border:'none', color:'var(--text-dim)', cursor:'pointer', fontSize:'1rem', lineHeight:1}} title="New Folder">📁</button>
                                <button onClick={downloadWorkspace} style={{background:'none', border:'none', color:'var(--text-dim)', cursor:'pointer', fontSize:'0.9rem', lineHeight:1}} title="Download Workspace">💾</button>
                            </div>
                        </div>
                        {examplesLoading && <p className="workspace-note" role="status">Loading examples…</p>}
                        {storageError && <p className="workspace-note workspace-error" role="alert">{storageError}</p>}
                        {examplesError && <div className="workspace-note workspace-error" role="alert">{examplesError}<button className="panel-action" onClick={refreshExamples}>Retry</button></div>}
                        {renderTree(null)}
                    </aside>
                    <div className="pane-resizer explorer-resizer" {...resizeHandleProps('explorer')}></div>
                    </div>
                    <div className="main" ref={mainRef}>
                        <div className="toolbar">
                            <div className="runtime-actions">
                                <select 
                                    value={selectedModel}
                                    onChange={(e) => setSelectedModel(e.target.value)}
                                    title="Semantic Engine Model"
                                    style={{
                                        background: 'rgba(255,255,255,0.05)',
                                        color: '#e2e8f0',
                                        border: '1px solid var(--border)',
                                        borderRadius: '4px',
                                        padding: '7px 12px',
                                        fontSize: '11px',
                                        fontWeight: '600',
                                        fontFamily: 'inherit',
                                        outline: 'none',
                                        cursor: 'pointer'
                                    }}
                                >
                                    {LOCAL_MODELS.map(m => (
                                        <option key={m.id} value={m.id} style={{background: '#0a0a0c'}}>{m.name}</option>
                                    ))}
                                </select>
                                <button className="btn" onClick={run} disabled={!engineReady || !editorReady || isRunning || !activeFile}>{isRunning ? 'RUNNING...' : engineError ? 'RUNTIME UNAVAILABLE' : engineReady && editorReady ? 'EXECUTE RUNTIME' : 'LOADING ENGINE...'}</button>
                                {isRunning && <button className="btn btn-secondary" onClick={stopRuntime}>STOP</button>}
                                {engineError && <button className="btn btn-secondary" onClick={() => rebootWorker()} title={engineError}>RETRY RUNTIME</button>}
                            </div>
                            <div className="workspace-actions">
                            <div className="system-status" title="Python execution status" style={{fontSize:'0.65rem', color:'var(--success)', fontWeight:800, letterSpacing:'1px', display:'flex', alignItems:'center', gap:'8px'}}>
                                <div style={{width:6, height:6, borderRadius:'50%', background: engineError ? 'var(--error)' : 'var(--success)'}}></div> {engineError ? 'RUNTIME UNAVAILABLE' : !engineReady ? 'LOADING PYTHON' : isRunning ? 'RUNNING' : rca?.llmLoading ? 'ANALYZING' : 'PYTHON READY'}
                            </div>
                            <div className="layout-controls" role="group" aria-label="Workspace panels">
                                <button className="panel-toggle" onClick={() => togglePane('explorer')} aria-label="Toggle explorer" aria-pressed={layout.explorerVisible} aria-controls="explorer-panel" aria-keyshortcuts="Control+B Meta+B" title="Toggle Explorer (Ctrl+B)">
                                    <PaneIcon name="explorer"/><span>Explorer</span>
                                </button>
                                <button ref={consoleToggleRef} className="panel-toggle" onClick={() => togglePane('console')} aria-label="Toggle console" aria-pressed={layout.consoleVisible} aria-controls="console-panel" aria-keyshortcuts="Control+J Meta+J" title="Toggle Console (Ctrl+J)">
                                    <PaneIcon name="console"/><span>Console</span>
                                </button>
                                <button ref={analysisToggleRef} className="panel-toggle" onClick={() => togglePane('analysis')} aria-label="Toggle analysis" aria-pressed={layout.analysisVisible} aria-controls="analysis-panel" aria-keyshortcuts="Control+Alt+A Meta+Alt+A" title="Toggle Root Cause Analysis (Ctrl+Alt+A)">
                                    <PaneIcon name="analysis"/><span>Analysis</span>
                                </button>
                                <button className="panel-action" onClick={() => { setLayout({ ...DEFAULT_LAYOUT }); setConsoleMaximized(false); }} aria-label="Reset panel layout" title="Reset panel layout">
                                    <PaneIcon name="reset"/>
                                </button>
                            </div>
                            </div>
                        </div>
                        <div className="editor-zone" ref={editorZoneRef} hidden={layout.consoleVisible && consoleMaximized}>
                            <div className="editor-container">
                                <div className="tabs-container">
                                    {openTabs.map(tId => {
                                        const tFile = files.find(f => f.id === tId);
                                        if (!tFile) return null;
                                        return (
                                            <div key={tId} className={`editor-tab ${activeId === tId ? 'active' : ''}`} onClick={() => openFile(tId)}>
                                                <span>📄 {tFile.name}</span>
                                                <span className="tab-close" onClick={(e) => closeTab(e, tId)}>×</span>
                                            </div>
                                        );
                                    })}
                                </div>
                                <div id="monaco-container" ref={monacoRef}></div>
                            </div>
                            <aside className="rca-panel" id="analysis-panel" aria-labelledby="analysis-panel-title" hidden={!layout.analysisVisible}>
                                <div className="pane-resizer analysis-resizer" {...resizeHandleProps('analysis')}></div>
                                <div className="rca-header">
                                    <div className="pane-heading"><PaneIcon name="analysis"/><h2 className="rca-title" id="analysis-panel-title">{rca?.sourceType === 'log' ? 'Log Root Cause Analysis' : 'Root Cause Analysis'}</h2></div>
                                    <button className="panel-action" onClick={() => hidePane('analysis')} aria-label="Hide analysis" title="Hide Analysis (Ctrl+Alt+A)"><PaneIcon name="close"/></button>
                                </div>
                                <div className="rca-body">
                                {rca && (rca.sourceFilename || rca.logFilename) && <div className="analysis-origin">{rca.sourceType === 'log' ? 'Log' : 'Last run'}: {rca.sourceFilename || rca.logFilename}{rca.sourceModel && <span>Model: {rca.sourceModel}</span>}</div>}
                                {!rca && <div className="panel-empty-state"><PaneIcon name="analysis"/><h2>No analysis yet</h2><p>Run a Python file or upload a log to inspect its root cause analysis here.</p><p>You can hide and reopen this panel anytime.</p></div>}
                                {rca && (() => {
                                const parsedStream = rca.llmLoading ? parsePartialJSON(rca.streamText) : {};
                                const activeFeedback = rca.llmLoading ? parsedStream : (rca.feedback || {});
                                const hasGeneratedFeedback = Boolean(formatFeedbackForTranslation(activeFeedback).trim());
                                const isLogDebug = rca.sourceType === 'log';
                                const traceFrames = Array.isArray(rca.frames) ? rca.frames : [];
                                
                                const deterministicIns = rca.ins;

                                return (
                                    <React.Fragment>
                                        <div className="diagnostic-card" style={{border: '1px solid rgba(168, 85, 247, 0.2)', background: 'rgba(168, 85, 247, 0.05)'}}>
                                            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1.25rem'}}>
                                                <div style={{fontSize:'0.65rem', fontWeight:800, color:'#a855f7', letterSpacing:'0.1em'}}>{isLogDebug ? 'LOG LLM ANALYSIS' : 'SEMANTIC LLM ANALYSIS'}</div>
                                                {rca.llmLoading 
                                                    ? <div style={{fontSize:'0.65rem', color:'var(--text-dim)', fontWeight:700, display:'flex', alignItems:'center', gap:'6px'}}>
                                                        <div style={{width:6, height:6, borderRadius:'50%', background:'#a855f7', animation:'pulse 1s infinite'}}></div> STREAMING...
                                                      </div>
                                                    : <div style={{fontSize:'0.65rem', color: rca.mlError ? 'var(--error)' : 'var(--success)', fontWeight:700, display:'flex', alignItems:'center', gap:'6px'}}>
                                                        <div style={{width:6, height:6, borderRadius:'50%', background: rca.mlError ? 'var(--error)' : 'var(--success)'}}></div> {rca.mlError ? 'UNAVAILABLE' : 'READY'}
                                                      </div>
                                                }
                                            </div>

                                            {isLogDebug && (
                                                <div className="feedback-block" style={{borderColor: 'rgba(250, 204, 21, 0.22)'}}>
                                                    <div className="feedback-block-title" style={{color: '#facc15'}}>Uploaded Log</div>
                                                    <div className="diagnostic-text">{rca.logFilename || 'uploaded.log'}</div>
                                                    {rca.logExcerpt && <pre className="log-excerpt">{rca.logExcerpt}</pre>}
                                                </div>
                                            )}

                                            {hasGeneratedFeedback && (
                                                <>
                                                    {activeFeedback.headline && (
                                                        <div className="feedback-block" style={{borderLeft: '2px solid #a855f7', paddingLeft: '1rem'}}>
                                                            <div className="feedback-block-title" style={{color: '#a855f7'}}>LLM Diagnosis</div>
                                                            <p style={{fontSize: '0.9rem', color: '#e2e8f0', lineHeight: 1.6, margin: 0}}>{activeFeedback.headline}</p>
                                                        </div>
                                                    )}
                                                    {activeFeedback.root_cause && (
                                                        <div className="feedback-block" style={{borderLeft: '2px solid #a855f7', paddingLeft: '1rem'}}>
                                                            <div className="feedback-block-title" style={{color: '#a855f7'}}>Deep Root Cause</div>
                                                            <p style={{fontSize: '0.9rem', color: '#e2e8f0', lineHeight: 1.6, margin: 0}}>{activeFeedback.root_cause}</p>
                                                        </div>
                                                    )}
                                                    {(Array.isArray(activeFeedback.evidence) && activeFeedback.evidence.length > 0) && (
                                                        <div className="feedback-block">
                                                            <div className="feedback-block-title">Evidence</div>
                                                            <ul className="feedback-list">
                                                                {activeFeedback.evidence.map((item, idx) => <li key={`e-${idx}`}>{item}</li>)}
                                                            </ul>
                                                        </div>
                                                    )}
                                                    {((Array.isArray(activeFeedback.fix_steps) && activeFeedback.fix_steps.length > 0) || activeFeedback.primary_fix || (Array.isArray(activeFeedback.code_actions) && activeFeedback.code_actions.length > 0)) && (
                                                        <div className="feedback-block">
                                                            <div className="feedback-block-title">Developer Fix Plan</div>
                                                            {Array.isArray(activeFeedback.fix_steps) && activeFeedback.fix_steps.length > 0 && (
                                                                <ol className="feedback-list">
                                                                    {activeFeedback.fix_steps.map((item, idx) => <li key={`f-${idx}`}>{item}</li>)}
                                                                </ol>
                                                            )}
                                                            {(() => {
                                                                const codeActs = Array.isArray(activeFeedback.code_actions) ? activeFeedback.code_actions : [];
                                                                const action = codeActs.find(item => item.after) || codeActs[0] || null;
                                                                const codeSuggestion = action
                                                                    ? [
                                                                        action.before ? `Current:\n${action.before}` : '',
                                                                        action.after ? `\nLearned repair pattern:\n${action.after}` : ''
                                                                      ].filter(Boolean).join('\n')
                                                                    : '';
                                                                if (codeSuggestion) {
                                                                    return <pre className="code-suggestion">{codeSuggestion}</pre>;
                                                                }
                                                                return null;
                                                            })()}
                                                        </div>
                                                    )}
                                                    {(Array.isArray(activeFeedback.prevention) && activeFeedback.prevention.length > 0) && (
                                                        <div className="feedback-block">
                                                            <div className="feedback-block-title">Prevention Checks</div>
                                                            <ul className="feedback-list">
                                                                {activeFeedback.prevention.map((item, idx) => <li key={`p-${idx}`}>{item}</li>)}
                                                            </ul>
                                                        </div>
                                                    )}
                                                    {(Array.isArray(activeFeedback.debug_questions) && activeFeedback.debug_questions.length > 0) && (
                                                        <div className="feedback-block">
                                                            <div className="feedback-block-title">Debugging Questions</div>
                                                            <ul className="feedback-list">
                                                                {activeFeedback.debug_questions.map((item, idx) => <li key={`q-${idx}`}>{item}</li>)}
                                                            </ul>
                                                        </div>
                                                    )}

                                                    {!rca.llmLoading && (
                                                        <div className="feedback-block" style={{borderColor: 'rgba(16, 185, 129, 0.25)'}}>
                                                            <div className="feedback-block-title" style={{color: 'var(--success)'}}>Translate Generated RCA</div>
                                                            <div className="translate-controls">
                                                                <select
                                                                    className="language-select"
                                                                    value={selectedLanguage}
                                                                    onChange={(e) => setSelectedLanguage(e.target.value)}
                                                                    title="Select target language"
                                                                >
                                                                    {INDIAN_LANGUAGES.map(language => (
                                                                        <option key={language.code} value={language.code}>{language.name}</option>
                                                                    ))}
                                                                </select>
                                                                <button
                                                                    className="btn btn-secondary"
                                                                    onClick={() => translateGeneratedRca(activeFeedback, deterministicIns?.explanation || '')}
                                                                    disabled={isTranslating}
                                                                >
                                                                    {isTranslating ? 'CONVERTING...' : 'CONVERT'}
                                                                </button>
                                                            </div>
                                                            {translationError && <div className="translation-error">{translationError}</div>}
                                                            {translatedRca && <pre className="translated-output">{translatedRca}</pre>}
                                                        </div>
                                                    )}
                                                </>
                                            )}

                                            {rca.mlError && (
                                                <div className="feedback-block">
                                                    <div className="feedback-block-title">Local ML Backend</div>
                                                    <div className="diagnostic-text">{rca.mlError}</div>
                                                </div>
                                            )}


                                        </div>

                                        <div>
                                            <div className="rca-title" style={{marginBottom: '2rem'}}>{isLogDebug ? 'LOG FAILURE TRACE' : 'TECHNICAL EXECUTION TRACE'}</div>
                                            <div className="graph-container">
                                                {traceFrames.length === 0 && (
                                                    <div className="graph-node">
                                                        <div style={{fontSize:'13px', fontWeight:700, color:'#f8fafc'}}>No structured trace frames detected</div>
                                                    </div>
                                                )}
                                                {traceFrames.map((f, i) => {
                                                    const isRoot = i === rca.rc;
                                                    const isException = i === traceFrames.length - 1;
                                                    const isBoth = isRoot && isException;
                                                    return (
                                                        <div key={i} className={`graph-node ${isRoot ? 'root' : ''} ${isException ? 'exception' : ''}`}>
                                                            {/* Tags row — always inline at top to avoid absolute overlap */}
                                                            {(isRoot || isException) && (
                                                                <div style={{display:'flex', gap:'8px', marginBottom:'12px', flexWrap:'wrap'}}>
                                                                    {isRoot && (
                                                                        <div style={{fontSize:'9px', fontWeight:900, background:'var(--success)', color:'#000', padding:'3px 10px', borderRadius:'12px', letterSpacing:'0.05em'}}>
                                                                            ROOT CAUSE
                                                                        </div>
                                                                    )}
                                                                    {isException && (
                                                                        <div style={{fontSize:'9px', fontWeight:900, background:'var(--error)', color:'#fff', padding:'3px 10px', borderRadius:'12px', letterSpacing:'0.05em'}}>
                                                                            EXCEPTION
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            )}
                                                            <div style={{fontSize:'13px', fontWeight:700, color:'#f8fafc', marginBottom:'10px'}}>{f.func}() <span style={{fontWeight:500, color:'var(--text-dim)'}}>at Line {f.line}</span></div>
                                                            <div style={{fontSize:'12px', color:'#93c5fd', fontFamily:'JetBrains Mono, monospace', background:'rgba(0,0,0,0.4)', padding:'10px', borderRadius:'8px', border:'1px solid rgba(147, 197, 253, 0.1)'}}>{String(f.code || '').trim()}</div>
                                                            {i < traceFrames.length - 1 && (
                                                                <div className="graph-edge">
                                                                    <div className="graph-arrow"></div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </React.Fragment>
                                );
                            })()}
                                </div>
                            </aside>
                        </div>
                        <section className={`terminal ${consoleMaximized ? 'is-maximized' : ''}`} id="console-panel" aria-labelledby="console-panel-title" hidden={!layout.consoleVisible}>
                            {!consoleMaximized && <div className="pane-resizer terminal-resizer" {...resizeHandleProps('console')}></div>}
                            <div className="terminal-header">
                                <div className="pane-heading"><PaneIcon name="console"/><h2 className="terminal-title" id="console-panel-title">SYSTEM CONSOLE & REPL</h2></div>
                                <div className="pane-actions">
                                    <button className="panel-action" onClick={() => { if(termInstance.current) { termInstance.current.clear(); termInstance.current.write('\x1bcPYGLIDE SYSTEM CONSOLE\r\n' + (isWaitingForInputRef.current ? 'Input: ' : isReplRef.current ? '>>> ' : '') + currentLineRef.current); } }} title="Clear console">CLEAR</button>
                                    <button className="panel-action" onClick={() => setConsoleMaximized(previous => !previous)} aria-label={consoleMaximized ? 'Restore console size' : 'Maximize console'} title={consoleMaximized ? 'Restore console size' : 'Maximize console'}><PaneIcon name={consoleMaximized ? 'restore' : 'maximize'}/></button>
                                    <button className="panel-action" onClick={() => hidePane('console')} aria-label="Hide console" title="Hide Console (Ctrl+J)"><PaneIcon name="close"/></button>
                                </div>
                            </div>
                            <div id="xterm-container" ref={termRef}></div>
                        </section>
                    </div>
                    {deleteTarget && (
                        <div className="delete-backdrop" onClick={cancelDeletion}>
                            <form className="delete-dialog" role="dialog" aria-modal="true" aria-labelledby="delete-dialog-title" onSubmit={confirmDeletion} onClick={event => event.stopPropagation()} onKeyDown={event => { if (event.key === 'Escape') cancelDeletion(); }}>
                                <h2 id="delete-dialog-title">Delete “{deleteTarget.name}”?</h2>
                                <p>This permanently deletes {deleteTarget.fileCount > 1 ? `${deleteTarget.fileCount} files` : 'the selected item'}. Example files are also removed from the project’s examples folder.</p>
                                {deleteTarget.deleteFolder && <p>This includes disk examples moved to other workspace folders.</p>}
                                {deleteTarget.requiresPassword && <label className="delete-password-label">Example deletion password
                                    <input autoFocus type="password" autoComplete="off" value={deletePassword} onChange={event => setDeletePassword(event.target.value)} disabled={isDeleting} required />
                                </label>}
                                {deleteError && <p className="delete-error" role="alert">{deleteError}</p>}
                                <div className="delete-dialog-actions">
                                    <button type="button" className="btn btn-secondary" onClick={cancelDeletion} disabled={isDeleting} autoFocus={!deleteTarget.requiresPassword}>Cancel</button>
                                    <button type="submit" className="btn delete-button" disabled={isDeleting || (deleteTarget.requiresPassword && !deletePassword)}>{isDeleting ? 'Deleting…' : 'Delete permanently'}</button>
                                </div>
                            </form>
                        </div>
                    )}
                    {contextMenu && (
                        <ViewportContextMenu menu={contextMenu} onClose={() => setContextMenu(null)}>
                            <div className="context-menu-item" onClick={() => { handleRenameStart(contextMenu.file.id); }}>✎ Rename</div>
                            <div className="context-menu-item" onClick={() => { handleDuplicate(contextMenu.file.id); }}>⎘ Duplicate</div>
                            <div className="context-menu-divider"></div>
                            {contextMenu.file.type === 'folder' && (
                                <>
                                    <div className="context-menu-item" onClick={() => { setCreatingItem({ type: 'file', parentId: contextMenu.file.id }); setNewItemName(''); if (!contextMenu.file.isOpen) toggleFolder(contextMenu.file.id); setContextMenu(null); }}>+ New File</div>
                                    <div className="context-menu-item" onClick={() => { setCreatingItem({ type: 'folder', parentId: contextMenu.file.id }); setNewItemName(''); if (!contextMenu.file.isOpen) toggleFolder(contextMenu.file.id); setContextMenu(null); }}>📁 New Folder</div>
                                    <div className="context-menu-divider"></div>
                                </>
                            )}
                            <div className="context-menu-item danger" onClick={(e) => { handleDeleteFile(e, contextMenu.file.id); setContextMenu(null); }}>🗑️ Delete</div>
                        </ViewportContextMenu>
                    )}
                </div>
            );
        }
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
