    <style>
        :root {
            --bg: #0a0a0c;
            --sidebar: #070708;

        .terminal-header { font-size: 0.7rem; color: var(--text-dim); padding: 10px 20px; font-weight: 800; letter-spacing: 0.1em; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); display: flex; justify-content: space-between; align-items: center; }

        /* ENHANCED RCA PANEL */
        .rca-panel { 
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 500px; /* Wider for better reading */
            max-width: 90%;
            background: rgba(10, 10, 12, 0.98);

            padding: 2.5rem; 
            overflow-y: auto; 
            z-index: 100; 
            box-shadow: -30px 0 60px rgba(0,0,0,0.6); 
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: slideInRca 0.3s cubic-bezier(0.16, 1, 0.3, 1);

        @keyframes slideInRca {
            from { transform: translateX(100%); }

        .model-chip { border: 1px solid rgba(59, 130, 246, 0.25); background: rgba(59, 130, 246, 0.1); color: #bfdbfe; padding: 4px 10px; border-radius: 999px; font-size: 10px; font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; }
        .model-chip.success { border-color: rgba(16, 185, 129, 0.28); background: rgba(16, 185, 129, 0.1); color: #bbf7d0; }

        .feedback-block-title { color: var(--text-dim); font-size: 0.65rem; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.75rem; }
        .feedback-list { margin: 0; padding-left: 1.1rem; display: flex; flex-direction: column; gap: 0.65rem; color: #e2e8f0; font-size: 0.84rem; line-height: 1.55; }
        .feedback-list li::marker { color: var(--success); }
        .code-suggestion { margin-top: 0.75rem; background: rgba(0,0,0,0.35); border: 1px solid rgba(147, 197, 253, 0.12); border-radius: 8px; padding: 0.85rem; color: #bfdbfe; font-family: 'JetBrains Mono', monospace; white-space: pre-wrap; font-size: 0.78rem; line-height: 1.5; overflow: auto; }
        .log-excerpt { margin: 0.75rem 0 0; background: rgba(0,0,0,0.35); border: 1px solid rgba(59, 130, 246, 0.18); border-radius: 8px; padding: 0.85rem; color: #bfdbfe; white-space: pre-wrap; word-break: break-word; font-size: 0.78rem; line-height: 1.55; max-height: 220px; overflow: auto; }
        .log-upload-input { display: none; }
        .translate-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 0.85rem; }
        .language-select { flex: 1; min-width: 150px; background: rgba(255,255,255,0.05); color: #e2e8f0; border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 0.78rem; font-family: inherit; outline: none; cursor: pointer; }

        .translation-error { margin-top: 0.75rem; color: #f87171; font-size: 0.78rem; line-height: 1.5; }
        
        /* GRAPH-BASED RCA STYLES */

        .node-tag { position: absolute; right: 15px; top: -10px; font-size: 9px; font-weight: 900; padding: 3px 10px; border-radius: 12px; letter-spacing: 0.05em; }
        .node-tag.root { background: var(--success); color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .node-tag.exception { background: var(--error); color: #fff; box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); }
        
        .recommendation-card { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 1.5rem; border-radius: 16px; margin-top: 3rem; }
        .btn { background: var(--accent); color: #000; border: none; padding: 8px 16px; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.2s ease; }
        .btn:hover:not(:disabled) { background: #60a5fa; transform: translateY(-1px); }
        .btn-secondary { background: #222; color: #fff; border: 1px solid var(--border); }
        .btn-secondary:hover { background: #333; }
        
        .logo { font-size: 0.85rem; font-weight: 900; letter-spacing: 2px; color: var(--accent); margin-bottom: 3rem; padding-left: 10px; }
        .file-item { padding: 10px 16px; font-size: 0.8rem; color: var(--text-dim); cursor: pointer; border-radius: 6px; transition: all 0.2s; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; font-weight: 500; overflow: hidden; }
        .file-name-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .file-item:hover { background: rgba(255, 255, 255, 0.03); color: var(--text); }
        .file-item.active { background: var(--accent-dim); color: var(--accent); font-weight: 600; border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; }
        
        .context-menu { position: fixed; background: rgba(20, 20, 22, 0.98); border: 1px solid var(--border); backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 8px; padding: 6px; z-index: 9999; display: flex; flex-direction: column; min-width: 180px; }
        .context-menu-item { padding: 8px 12px; font-size: 0.8rem; color: var(--text); cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 10px; transition: background 0.1s; }
        .context-menu-item:hover { background: var(--accent-dim); color: var(--accent); }
        .context-menu-item.danger:hover { background: rgba(239, 68, 68, 0.15); color: var(--error); }
        .context-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }
        
        .stats-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 200; padding: 4rem; overflow-y: auto; backdrop-filter: blur(40px); }

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useRef } = React;

        const safeGetStats = () => {
            try {
                const data = localStorage.getItem('pyglide_stats');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed?.concepts && typeof parsed.concepts === 'object' && !Array.isArray(parsed.concepts)) {
                        const concepts = Object.fromEntries(Object.entries(parsed.concepts)
                            .filter(([name, count]) => name && Number.isInteger(count) && count > 0)
                            .map(([name, count]) => [name, Math.floor(count)]));
                        return { concepts, total: Object.values(concepts).reduce((sum, count) => sum + count, 0) };
                    }
                }
            } catch (e) {
                console.error("Stats parse error:", e);
            }
            return { total: 0, concepts: {} };
        };

        const safeSaveStats = (stats) => {
            try {
                localStorage.setItem('pyglide_stats', JSON.stringify(stats));
                window.dispatchEvent(new Event('pyglide-stats'));
            } catch (e) {
                console.error("Stats save error:", e);
            }
        };

        const EXAMPLES_FOLDER_ID = 'pyglide-examples';
        const WORKSPACE_FOLDER_ID = 'pyglide-workspace';
        const EXAMPLES_API = 'http://localhost:8000/workspace/examples';

        const extractExceptionType = (msg) => {
            const lines = msg.split('\n').map(l => l.trim()).filter(Boolean);
            const last = lines[lines.length - 1] || "";
            const match = last.match(/^([A-Za-z_][\w.]*Error):?/);
            if (match) return match[1].split('.').pop();
            const any = msg.match(/\b([A-Za-z_][A-Za-z0-9_]*Error)\b/);
            return any ? any[1] : "RuntimeError";
        };

        const extractExceptionMessage = (msg) => {
            const lines = msg.split('\n').map(l => l.trim()).filter(Boolean);
            const last = lines[lines.length - 1] || msg;
            return last.replace(/^[A-Za-z_][\w.]*Error:\s*/, '');
        };

        const fetchLocalMLFeedback = async (traceback, code) => {
            const response = await fetch('http://localhost:8000/rca', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    exception_type: extractExceptionType(traceback),
                    message: extractExceptionMessage(traceback),
                    traceback,
                    code
                })
            });
            if (!response.ok) throw new Error(`Local model server returned ${response.status}`);
            const data = await response.json();
            return data.llm_feedback;
        };

        // =========================================================
        // PageRank-based Root Cause Identification
        // Ported from SemanticLogDebugger_RootCauseAnalysis/SematicLogDebugger_Final.ipynb
        // Core algorithm: perform_rca() - builds a DAG from the execution trace,
        // runs PageRank (alpha=0.85) and picks the highest-scoring node as root cause.
        // =========================================================
        const pageRank = (nodes, edges, alpha = 0.85, maxIter = 100, tol = 1e-6) => {
            if (nodes.length === 0) return {};
            const N = nodes.length;
            const nodeIdx = {};
            nodes.forEach((n, i) => nodeIdx[n] = i);

            // Build adjacency: outEdges[i] = list of j that i points to
            const outEdges = Array.from({length: N}, () => []);
            const inEdges  = Array.from({length: N}, () => []);
            edges.forEach(([src, dst]) => {
                const s = nodeIdx[src], d = nodeIdx[dst];
                if (s !== undefined && d !== undefined) {
                    outEdges[s].push(d);
                    inEdges[d].push(s);
                }
            });

            let scores = new Array(N).fill(1 / N);
            for (let iter = 0; iter < maxIter; iter++) {
                const newScores = new Array(N).fill((1 - alpha) / N);
                for (let i = 0; i < N; i++) {
                    const outs = outEdges[i];
                    if (outs.length === 0) {
                        // Dangling node: distributes rank equally to all
                        const share = alpha * scores[i] / N;
                        for (let j = 0; j < N; j++) newScores[j] += share;
                    } else {
                        const share = alpha * scores[i] / outs.length;
                        outs.forEach(j => newScores[j] += share);
                    }
                }
                // Check convergence
                const diff = scores.reduce((s, v, i) => s + Math.abs(v - newScores[i]), 0);
                scores = newScores;
                if (diff < tol) break;
            }

            const result = {};
            nodes.forEach((n, i) => result[n] = scores[i]);
            return result;
        };

        const analyze = (msg, code) => {
            const frames = [];
            const codeLines = code.split('\n');
            const totalLines = codeLines.length;
            const regex = /File "(.*)", line (\d+), in (.*)/g;
            let m;
            while ((m = regex.exec(msg)) !== null) {
                const ln = parseInt(m[2]);
                if (ln <= totalLines) frames.push({ line: ln, func: m[3], code: codeLines[ln-1] || "" });
            }
            if (frames.length === 0) {
                const lnMatch = msg.match(/line (\d+)/);
                if (lnMatch) {
                    const ln = parseInt(lnMatch[1]);
                    if (ln <= totalLines) frames.push({ line: ln, func: "module", code: codeLines[ln-1] || "" });
                }
            }

            const insights = [
                { 
                    pattern: /SyntaxError/, 
                    title: "Syntax Error", 
                    symptom: "Python could not parse the code at line {LINE} — this is a compilation failure, not a runtime failure.", 
                    cause: "A syntax error means the code structure violated Python grammar rules. Common causes include a missing colon after `def` or `if`, mismatched parentheses or brackets, invalid use of operators, or illegal indentation.",
                    resolution: "Carefully inspect the flagged line and the line immediately above it. Look for unclosed brackets, missing colons, or misplaced keywords."
                },
                { 
                    pattern: /IndentationError/, 
                    title: "Indentation Error", 
                    symptom: "Python detected an inconsistent or unexpected indentation level at line {LINE}.", 
                    cause: "Python uses indentation to define code blocks. Mixing tabs and spaces, or using inconsistent indent widths across a block, causes the parser to reject the file before execution.",
                    resolution: "Ensure all indentation uses consistent spaces (4 spaces recommended). Use an editor with visible whitespace to detect tab/space mixing. The offending line is typically one that breaks the expected indentation depth."
                },
                { 
                    pattern: /ZeroDivision/, 
                    title: "Mathematical Inconsistency", 
                    symptom: "The program attempted to divide a number by zero at line {LINE}.", 
                    cause: "Python cannot mathematically reconcile division by zero. This usually happens when a variable acting as a denominator evaluates to 0 during runtime — often because of an unvalidated user input or a loop that reduces a counter to zero.",
                    resolution: "Implement a guard clause (e.g., `if denominator == 0: return`) before the division operation. Trace which code path produces the zero denominator and validate input early."
                },
                { 
                    pattern: /IndexError/, 
                    title: "Boundary Violation", 
                    symptom: "The code attempted to access an element in a sequence using an out-of-bounds index at line {LINE}.", 
                    cause: "The index requested is either greater than the maximum valid index (length - 1), or negative enough to wrap past the beginning of the sequence. For example, accessing index 4 in a 3-item list.",
                    resolution: "Verify your loop boundaries or index calculations. Ensure they strictly satisfy `0 <= index < len(sequence)`. Consider using `enumerate()` for safe iteration instead of manual indexing."
                },
                { 
                    pattern: /KeyError/, 
                    title: "Schema Violation", 
                    symptom: "A required data identifier (key) was missing from a dictionary at line {LINE}.", 
                    cause: "The code explicitly requested a key that does not exist in the current dictionary. This often occurs when processing dynamic API responses, iterating over objects with inconsistent schemas, or after a key was renamed or removed.",
                    resolution: "Use `dict.get(key, default_value)` for safe access, or check `if key in dict:` before accessing. For nested keys, validate each level independently before accessing."
                },
                { 
                    pattern: /NameError/, 
                    title: "Identifier Failure", 
                    symptom: "An undefined variable or function name was referenced at line {LINE}.", 
                    cause: "The Python interpreter encountered a name it does not recognize in the current scope. This is typically due to a typo, a missing import statement, or calling a variable before it has been assigned a value in the executing scope.",
                    resolution: "Check the spelling of the identifier carefully. Ensure the variable is assigned before use, and that any required modules are imported at the top of the file. If defined inside a function, verify the scope is accessible from the call site."
                }
            ];
            
            let ins = { 
                title: "Logic Anomaly", 
                symptom: "A logical interruption occurred during execution at line {LINE}.", 
                cause: "An unexpected state was reached that the runtime could not process.",
                resolution: "Review the causal chain below to trace the exact injection point of the fault."
            };
            
            for (const i of insights) if (i.pattern.test(msg)) ins = i;

            const stats = safeGetStats();
            stats.total += 1;
            stats.concepts[ins.title] = (stats.concepts[ins.title] || 0) + 1;
            safeSaveStats(stats);

            // =========================================================
            // DAG + PageRank Root Cause Selection
            // Mirrors SemanticLogDebugger.perform_rca():
            //   G = nx.DiGraph((seq[i], seq[i+1]) for i in range(len(seq)-1))
            //   chosen = max(nx.pagerank(G, alpha=0.85), key=scores.get)
            // Frames = trace nodes; sequential call order = directed edges
            // =========================================================
            let rcIdx = 0;
            let rcExplanation = 'fallback: single frame';

            if (frames.length === 1) {
                rcIdx = 0;
                rcExplanation = 'singleton trace';
            } else if (frames.length > 1) {
                // Build node list (use func+line as unique node ID)
                const nodeIds = frames.map((f, i) => `${f.func}@${f.line}@${i}`);
                // Build edges: execution order seq[i] -> seq[i+1]
                const edges = [];
                for (let i = 0; i < nodeIds.length - 1; i++) {
                    edges.push([nodeIds[i], nodeIds[i + 1]]);
                }
                const scores = pageRank(nodeIds, edges, 0.85);
                // Find the frame with the highest PageRank score
                let bestScore = -1;
                nodeIds.forEach((nid, i) => {
                    if (scores[nid] > bestScore) { bestScore = scores[nid]; rcIdx = i; }
                });
                rcExplanation = `root by PageRank (score: ${bestScore.toFixed(4)})`;
            }

            const lineRef = frames.length > 0 ? frames[rcIdx].line : "?";
            const rcFrame = frames[rcIdx];
            const lineCode = rcFrame ? rcFrame.code.trim() : '';
            
            return { 
                frames, 
                rc: rcIdx,
                rawMsg: msg,
                lineCode,
                ins: { 
                    title: ins.title,
                    symptom: ins.symptom.replace(/{LINE}/g, lineRef),
                    cause: ins.cause.replace(/{LINE}/g, lineRef),
                    resolution: ins.resolution.replace(/{LINE}/g, lineRef)
                } 
            };
        };

        function AnalyticsPanel({ onBack }) {
            const [stats, setStats] = useState(safeGetStats);
            useEffect(() => {
                const refresh = () => setStats(safeGetStats());
                window.addEventListener('pyglide-stats', refresh);
                window.addEventListener('storage', refresh);
                return () => {
                    window.removeEventListener('pyglide-stats', refresh);
                    window.removeEventListener('storage', refresh);
                };
            }, []);
            const entries = Object.entries(stats.concepts).sort((a,b)=>b[1]-a[1]);
            const maxVal = Math.max(...Object.values(stats.concepts), 1);
            
            const topError = entries.length > 0 ? entries[0][0] : "None Yet";
            const secondError = entries.length > 1 ? entries[1][0] : null;

            const maps = {
                "MATHEMATICAL INCONSISTENCY": {
                    focus: "Math & Edge Cases",
                    tips: [
                        "Check your numbers before doing math, especially division.",
                        "Handle unexpected zero values early so the code doesn't crash.",
                        "Think about what happens if a variable is empty or negative."
                    ]
                },
                "BOUNDARY VIOLATION": {
                    focus: "Lists & Loops",
                    tips: [
                        "Always make sure the list item you want actually exists.",
                        "Be careful when looping—don't accidentally go past the end of the list.",
                        "Check the length of your collections before trying to access the last few items."
                    ]
                },
                "SCHEMA VIOLATION": {
                    focus: "Data Structures",

        const parsePartialJSON = (raw) => {
            const result = {};
            if (!raw) return result;
            
            // Clean markdown code fences if any
            let cleaned = raw.replace(/```(?:json)?/g, "").trim();
            
            const stringFields = ["headline", "diagnosis", "root_cause", "primary_fix", "severity", "learning_note"];
            stringFields.forEach(field => {
                const completeRegex = new RegExp(`"${field}"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"`);
                const completeMatch = cleaned.match(completeRegex);
                if (completeMatch) {
                    result[field] = completeMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
                } else {
                    const partialRegex = new RegExp(`"${field}"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)$`);
                    const partialMatch = cleaned.match(partialRegex);
                    if (partialMatch) {
                        result[field] = partialMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
                    }
                }
            });

            const listFields = ["evidence", "fix_steps", "prevention", "validation_checks", "debug_questions"];
            listFields.forEach(field => {
                const arrayRegex = new RegExp(`"${field}"\\s*:\\s*\\[([\\s\\S]*?)\\]`);
                const arrayMatch = cleaned.match(arrayRegex);
                if (arrayMatch) {
                    const itemsText = arrayMatch[1];
                    const items = [];
                    const itemRegex = /"((?:[^"\\]|\\.)*)"/g;
                    let itemMatch;
                    while ((itemMatch = itemRegex.exec(itemsText)) !== null) {
                        const val = itemMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
                        if (!["title", "reason", "before", "after", "step"].includes(val.toLowerCase().trim())) {
                            items.push(val);
                        }
                    }
                    result[field] = items;
                } else {
                    const partialArrayRegex = new RegExp(`"${field}"\\s*:\\s*\\[([\\s\\S]*?)$`);
                    const partialArrayMatch = cleaned.match(partialArrayRegex);
                    if (partialArrayMatch) {
                        const itemsText = partialArrayMatch[1];
                        const items = [];
                        const itemRegex = /"((?:[^"\\]|\\.)*)"/g;
                        let itemMatch;
                        let lastIndex = 0;
                        while ((itemMatch = itemRegex.exec(itemsText)) !== null) {
                            const val = itemMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
                            if (!["title", "reason", "before", "after", "step"].includes(val.toLowerCase().trim())) {
                                items.push(val);
                            }
                            lastIndex = itemRegex.lastIndex;
                        }
                        const trailingText = itemsText.slice(lastIndex);
                        const trailingMatch = trailingText.match(/"((?:[^"\\]|\\.)*)$/);
                        if (trailingMatch) {
                            items.push(trailingMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n'));
                        }
                        result[field] = items;
                    }
                }
            });

            const actionsRegex = /"code_actions"\s*:\s*\[([\s\S]*?)\]/;
            const actionsMatch = cleaned.match(actionsRegex);
            if (actionsMatch) {
                const actionsText = actionsMatch[1];
                const actions = [];
                const objRegex = /\{([\s\S]*?)\}/g;
                let objMatch;
                while ((objMatch = objRegex.exec(actionsText)) !== null) {
                    const objContent = objMatch[1];
                    const action = {};
                    ["title", "reason", "before", "after"].forEach(key => {
                        const keyMatch = objContent.match(new RegExp(`"${key}"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"`));
                        if (keyMatch) action[key] = keyMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
                    });
                    actions.push(action);
                }
                result["code_actions"] = actions;
            } else {
                const partialActionsRegex = /"code_actions"\s*:\s*\[([\s\S]*?)$/;
                const partialActionsMatch = cleaned.match(partialActionsRegex);
                if (partialActionsMatch) {
                    const actionsText = partialActionsMatch[1];
                    const actions = [];
                    const objRegex = /\{([\s\S]*?)\}/g;
                    let objMatch;
                    let lastIndex = 0;
                    while ((objMatch = objRegex.exec(actionsText)) !== null) {
                        const objContent = objMatch[1];
                        const action = {};
                        ["title", "reason", "before", "after"].forEach(key => {
                            const keyMatch = objContent.match(new RegExp(`"${key}"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"`));
                            if (keyMatch) action[key] = keyMatch[1].replace(/\\"/g, '"').replace(/\\n/g, '\n');
                        });
                        actions.push(action);
                        lastIndex = objRegex.lastIndex;
                    }
                    const trailingText = actionsText.slice(lastIndex);
                    const trailingObjMatch = trailingText.match(/\{([\s\S]*?)$/);
                    if (trailingObjMatch) {
                        const objContent = trailingObjMatch[1];
                        const action = {};
                        ["title", "reason", "before", "after"].forEach(key => {
                            const completeMatch = objContent.match(new RegExp(`"${key}"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"`));
                            if (completeMatch) {

        function ViewportContextMenu({ menu, onClose, children }) {
            const menuRef = useRef(null);
            const [position, setPosition] = useState({ left: menu.x, top: menu.y });

            useLayoutEffect(() => {
                const element = menuRef.current;
                const viewport = window.visualViewport;
                const reposition = () => {
                    const padding = 8;
                    const leftEdge = (viewport?.offsetLeft || 0) + padding;
                    const topEdge = (viewport?.offsetTop || 0) + padding;
                    const width = Math.max(0, (viewport?.width || window.innerWidth) - padding * 2);
                    const height = Math.max(0, (viewport?.height || window.innerHeight) - padding * 2);
                    element.style.minWidth = `${Math.min(180, width)}px`;
                    element.style.maxWidth = `${width}px`;
                    element.style.maxHeight = `${height}px`;
                    const bounds = element.getBoundingClientRect();
                    const left = Math.max(leftEdge, Math.min(menu.x, leftEdge + width - bounds.width));
                    const top = Math.max(topEdge, Math.min(menu.y, topEdge + height - bounds.height));
                    setPosition(previous => previous.left === left && previous.top === top ? previous : { left, top });
                };
                const onKeyDown = event => { if (event.key === 'Escape') onClose(); };
                reposition();
                const observer = new ResizeObserver(reposition);
                observer.observe(element);
                window.addEventListener('resize', reposition);
                viewport?.addEventListener('resize', reposition);
                viewport?.addEventListener('scroll', reposition);
                document.addEventListener('keydown', onKeyDown);
                return () => {
                    observer.disconnect();
                    window.removeEventListener('resize', reposition);
                    viewport?.removeEventListener('resize', reposition);
                    viewport?.removeEventListener('scroll', reposition);
                    document.removeEventListener('keydown', onKeyDown);
                };
            }, [menu, onClose]);

            return ReactDOM.createPortal(
                <div ref={menuRef} className="context-menu" style={position}
                    onContextMenu={event => { event.preventDefault(); event.stopPropagation(); }}
                    onClick={event => event.stopPropagation()}>
                    {children}
                </div>, document.body
            );
        }

                                evidence: [
                                    'Scanned all lines/cells for typical python tracebacks ("Traceback (most recent call last):").',
                                    'Scanned all lines/cells for standard Exception/Error name patterns.',
                                    'Scanned for severity level markers (ERROR, CRITICAL, FATAL, SEVERE).'
                                ],
                                fix_steps: [

                        accumulatedText += chunk;
